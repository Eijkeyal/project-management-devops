services:
  server:
    image: eijkeyal/pms-server:latest
    build: ./server
    container_name: pms-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    ports:
      - "5001:5001"

  client:
    image: eijkeyal/pms-client:latest
    build: ./client
    container_name: pms-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
