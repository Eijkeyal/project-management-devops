services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pms-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    ports:
      - "5001:5001"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pms-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
